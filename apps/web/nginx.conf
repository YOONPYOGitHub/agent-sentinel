server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Reverse proxy to API container app using ACA same-environment service discovery.
    # Path is preserved: /api/connector/status proxied as /api/connector/status to upstream.
    # Browsers never address the API container directly; this proxy is the sole path.
    location /api/ {
        proxy_pass         http://api-as-260814;
        proxy_http_version 1.1;
        proxy_set_header   Host              api-as-260814;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Pass Bearer credentials through to API authentication.
        proxy_set_header   Authorization     $http_authorization;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
