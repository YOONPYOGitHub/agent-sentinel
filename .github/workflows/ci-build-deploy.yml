# ci-build-deploy.yml
# Private CI/CD pipeline using self-hosted runner inside the Agent Sentinel VNet.
#
# Runner: self-hosted,linux,x64 plus the repository variable PRIVATE_RUNNER_LABEL
# Azure auth: az login --identity using runner UAMI (no OIDC, no secrets stored)
# ACR push: az acr login (identity) then docker push to private ACR via private endpoint
# Deploy: selected GitHub environment must have required reviewers before deployment is enabled
#
# Triggers:
#   - push to feature/** (build + validate only)
#   - workflow_dispatch (full build, with optional protected deployment)

name: CI Build & Deploy (Private Runner)

on:
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:
    inputs:
      commitSha:
        description: 'Exact 40-hex commit SHA to validate, build, and deploy'
        required: true
        type: string
      targetEnvironment:
        description: 'Approved GitHub deployment environment'
        required: false
        default: 'none'
        type: choice
        options:
          - 'none'
          - 'replacement-validation'
      parameterFile:
        description: 'Approved platform parameter file'
        required: false
        default: 'none'
        type: choice
        options:
          - 'none'
          - 'infra/environments/mngenvmcap098047.parameters.bicepparam'
      deployPlatform:
        description: 'Run the protected platform deployment after what-if approval?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ACR_NAME: ${{ vars.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ format('{0}.azurecr.io', vars.ACR_NAME) }}
  RUNNER_UAMI_CLIENT_ID: ${{ vars.RUNNER_UAMI_CLIENT_ID }}
  TARGET_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.targetEnvironment || 'none' }}
  PLATFORM_PARAMETER_FILE: ${{ github.event_name == 'workflow_dispatch' && inputs.parameterFile || 'none' }}

jobs:
  resolve:
    name: Resolve immutable commit
    runs-on: [self-hosted, linux, x64, '${{ vars.PRIVATE_RUNNER_LABEL }}']
    outputs:
      commitSha: ${{ steps.resolve.outputs.commitSha }}
    steps:
      - name: Validate requested commit SHA
        id: validate-sha
        env:
          REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commitSha || github.sha }}
        run: |
          if [[ ! "${REQUESTED_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ERROR: commitSha must be exactly 40 hexadecimal characters"
            exit 1
          fi
          NORMALIZED_SHA="${REQUESTED_SHA,,}"
          echo "commitSha=${NORMALIZED_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Validate approved deployment configuration
        env:
          DEPLOY_PLATFORM: ${{ github.event_name == 'workflow_dispatch' && inputs.deployPlatform || 'false' }}
          PRIVATE_RUNNER_LABEL: ${{ vars.PRIVATE_RUNNER_LABEL }}
        run: |
          require_match() {
            local name="$1"
            local value="$2"
            local pattern="$3"
            if [[ ! "${value}" =~ ${pattern} ]]; then
              echo "ERROR: ${name} is missing or invalid"
              exit 1
            fi
          }

          require_match AZURE_RESOURCE_GROUP "${AZURE_RESOURCE_GROUP}" '^[A-Za-z0-9._()-]{1,90}$'
          if [[ "${AZURE_RESOURCE_GROUP}" == *'..'* ]]; then
            echo "ERROR: AZURE_RESOURCE_GROUP contains a forbidden path-like value"
            exit 1
          fi
          require_match AZURE_SUBSCRIPTION_ID "${AZURE_SUBSCRIPTION_ID}" '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          require_match ACR_NAME "${ACR_NAME}" '^[a-z0-9]{5,50}$'
          require_match RUNNER_UAMI_CLIENT_ID "${RUNNER_UAMI_CLIENT_ID}" '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          require_match PRIVATE_RUNNER_LABEL "${PRIVATE_RUNNER_LABEL}" '^[A-Za-z0-9._-]{1,63}$'

          case "${TARGET_ENVIRONMENT}:${PLATFORM_PARAMETER_FILE}" in
            none:none)
              if [ "${DEPLOY_PLATFORM}" = 'true' ]; then
                echo "ERROR: deployment requires an approved target environment and parameter file"
                exit 1
              fi
              ;;
            replacement-validation:infra/environments/mngenvmcap098047.parameters.bicepparam)
              if [ "${ACR_NAME}" != 'acrm098047' ]; then
                echo "ERROR: replacement-validation requires ACR_NAME=acrm098047"
                exit 1
              fi
              ;;
            *)
              echo "ERROR: unapproved target environment or parameter file"
              exit 1
              ;;
          esac

          if [[ "${PLATFORM_PARAMETER_FILE}" == /* || "${PLATFORM_PARAMETER_FILE}" == *'..'* ]]; then
            echo "ERROR: parameter file path traversal is forbidden"
            exit 1
          fi

      - name: Checkout requested commit
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.validate-sha.outputs.commitSha }}

      - name: Resolve checked-out commit
        id: resolve
        env:
          REQUESTED_SHA: ${{ steps.validate-sha.outputs.commitSha }}
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "${HEAD_SHA}" != "${REQUESTED_SHA}" ]; then
            echo "ERROR: checked-out HEAD does not match the requested commit"
            exit 1
          fi
          echo "commitSha=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"

  # Job 1: Validate
  validate:
    name: Validate (lint / typecheck / test / bicep-build)
    needs: resolve
    runs-on: [self-hosted, linux, x64, '${{ vars.PRIVATE_RUNNER_LABEL }}']
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.commitSha }}

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@10.15.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release evidence schema
        run: |
          pnpm release-evidence:schema:check
          pnpm release-evidence:validate -- release-evidence/v1/examples/repository-only.json
          pnpm release-evidence:generate -- --output "${RUNNER_TEMP}/release-evidence.json"
          pnpm release-evidence:validate -- "${RUNNER_TEMP}/release-evidence.json"

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Build all packages/apps
        run: pnpm run build

      - name: Bicep build (linter)
        run: |
          az bicep build -f infra/platform.bicep
          az bicep build -f infra/ci-foundation.bicep
          az bicep build -f infra/connector-sources.bicep
          ADMIN_SSH_PUBLIC_KEY='offline-validation-placeholder' \
            az bicep build-params -f infra/environments/mngenvmcap098047-ci-foundation.parameters.bicepparam --stdout >/dev/null
          az bicep build-params -f infra/environments/mngenvmcap098047-connector-sources.parameters.bicepparam --stdout >/dev/null
          az bicep build-params -f infra/environments/mngenvmcap098047-foundry.parameters.bicepparam --stdout >/dev/null
          WEB_IMAGE_DIGEST='sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' \
          API_IMAGE_DIGEST='sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' \
          JOBS_IMAGE_DIGEST='sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc' \
            az bicep build-params -f infra/environments/mngenvmcap098047.parameters.bicepparam --stdout >/dev/null

  # Job 2: Build & Push Images
  build-push:
    name: Build & Push Container Images
    needs: [resolve, validate]
    runs-on: [self-hosted, linux, x64, '${{ vars.PRIVATE_RUNNER_LABEL }}']
    outputs:
      webDigest: ${{ steps.verify-images.outputs.webDigest }}
      apiDigest: ${{ steps.verify-images.outputs.apiDigest }}
      jobsDigest: ${{ steps.verify-images.outputs.jobsDigest }}
    env:
      EXPECTED_SHA: ${{ needs.resolve.outputs.commitSha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.commitSha }}

      - name: Determine image tag
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "${HEAD_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "ERROR: build checkout does not match the resolved commit"
            exit 1
          fi
          echo "IMAGE_TAG=${EXPECTED_SHA}" >> "${GITHUB_ENV}"
          echo "Building images with immutable tag: ${EXPECTED_SHA}"

      - name: Login to Azure (managed identity)
        run: |
          az login --identity --client-id "${{ env.RUNNER_UAMI_CLIENT_ID }}" --allow-no-subscriptions
          az account set --subscription "${AZURE_SUBSCRIPTION_ID}"

      - name: Login to ACR (identity ? no password)
        run: az acr login --name "${{ env.ACR_NAME }}"

      - name: Build and push web image
        run: |
          docker build \
            -f apps/web/Containerfile \
            -t "${ACR_LOGIN_SERVER}/agent-sentinel-web:${IMAGE_TAG}" \
            .
          docker push "${ACR_LOGIN_SERVER}/agent-sentinel-web:${IMAGE_TAG}"

      - name: Build and push api image
        run: |
          docker build \
            -f apps/api/Containerfile \
            -t "${ACR_LOGIN_SERVER}/agent-sentinel-api:${IMAGE_TAG}" \
            .
          docker run --rm \
            --workdir /app/apps/api \
            "${ACR_LOGIN_SERVER}/agent-sentinel-api:${IMAGE_TAG}" \
            node -e "Promise.all([import('@agent-sentinel/azure-monitor-otel-connector'), import('@agent-sentinel/azure-resource-graph-connector'), import('@agent-sentinel/behavior-engine'), import('@agent-sentinel/entra-identity-connector'), import('@agent-sentinel/power-platform-connector'), import('@agent-sentinel/agent365-connector'), import('@agent-sentinel/defender-cloud-apps-connector'), import('@agent-sentinel/purview-connector'), import('@agent-sentinel/teams-distribution-connector'), import('@agent-sentinel/manifest-connector')])"
          docker push "${ACR_LOGIN_SERVER}/agent-sentinel-api:${IMAGE_TAG}"

      - name: Build and push jobs image
        run: |
          docker build \
            -f apps/jobs/Containerfile \
            -t "${ACR_LOGIN_SERVER}/agent-sentinel-jobs:${IMAGE_TAG}" \
            .
          docker run --rm \
            --workdir /app/apps/jobs \
            "${ACR_LOGIN_SERVER}/agent-sentinel-jobs:${IMAGE_TAG}" \
            node -e "Promise.all([import('@agent-sentinel/azure-resource-graph-connector'), import('@agent-sentinel/entra-identity-connector'), import('@agent-sentinel/power-platform-connector'), import('@agent-sentinel/agent365-connector'), import('@agent-sentinel/defender-cloud-apps-connector'), import('@agent-sentinel/purview-connector'), import('@agent-sentinel/teams-distribution-connector'), import('@agent-sentinel/manifest-connector')])"
          docker push "${ACR_LOGIN_SERVER}/agent-sentinel-jobs:${IMAGE_TAG}"

      - name: Verify images in ACR
        id: verify-images
        run: |
          read_digest() {
            local repository="$1"
            local digest
            digest="$(az acr repository show \
              --name "${ACR_NAME}" \
              --image "${repository}:${IMAGE_TAG}" \
              --query digest \
              -o tsv)"
            if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "ERROR: ${repository}:${IMAGE_TAG} did not resolve to a canonical digest"
              exit 1
            fi
            printf '%s' "${digest}"
          }

          WEB_DIGEST="$(read_digest agent-sentinel-web)"
          API_DIGEST="$(read_digest agent-sentinel-api)"
          JOBS_DIGEST="$(read_digest agent-sentinel-jobs)"
          echo "webDigest=${WEB_DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "apiDigest=${API_DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "jobsDigest=${JOBS_DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "Verified immutable tags and digests for ${IMAGE_TAG}"

  # Job 3: Bicep What-If
  what-if:
    name: Bicep What-If
    needs: [resolve, build-push]
    if: github.event_name == 'workflow_dispatch' && inputs.targetEnvironment != 'none'
    runs-on: [self-hosted, linux, x64, '${{ vars.PRIVATE_RUNNER_LABEL }}']
    env:
      DEPLOYMENT_COMMIT_SHA: ${{ needs.resolve.outputs.commitSha }}
      WEB_IMAGE_DIGEST: ${{ needs.build-push.outputs.webDigest }}
      API_IMAGE_DIGEST: ${{ needs.build-push.outputs.apiDigest }}
      JOBS_IMAGE_DIGEST: ${{ needs.build-push.outputs.jobsDigest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.commitSha }}

      - name: Login to Azure
        run: |
          az login --identity --client-id "${{ env.RUNNER_UAMI_CLIENT_ID }}" --allow-no-subscriptions
          az account set --subscription "${AZURE_SUBSCRIPTION_ID}"

      - name: Bicep what-if
        run: |
          az deployment group what-if \
            -g "${AZURE_RESOURCE_GROUP}" \
            -f infra/platform.bicep \
            -p "${PLATFORM_PARAMETER_FILE}" \
            -p deploymentCommitSha="${{ needs.resolve.outputs.commitSha }}" \
            -p webImageDigest="${WEB_IMAGE_DIGEST}" \
            -p apiImageDigest="${API_IMAGE_DIGEST}" \
            -p jobsImageDigest="${JOBS_IMAGE_DIGEST}" \
            --result-format FullResourcePayloads

  # Job 4: Deploy
  deploy:
    name: Deploy Platform
    needs: [resolve, build-push, what-if]
    if: github.event_name == 'workflow_dispatch' && inputs.deployPlatform == 'true' && inputs.targetEnvironment != 'none'
    runs-on: [self-hosted, linux, x64, '${{ vars.PRIVATE_RUNNER_LABEL }}']
    environment: ${{ inputs.targetEnvironment }} # Configure required reviewers before enabling deployment.
    env:
      DEPLOYMENT_COMMIT_SHA: ${{ needs.resolve.outputs.commitSha }}
      WEB_IMAGE_DIGEST: ${{ needs.build-push.outputs.webDigest }}
      API_IMAGE_DIGEST: ${{ needs.build-push.outputs.apiDigest }}
      JOBS_IMAGE_DIGEST: ${{ needs.build-push.outputs.jobsDigest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.commitSha }}

      - name: Login to Azure
        run: |
          az login --identity --client-id "${{ env.RUNNER_UAMI_CLIENT_ID }}" --allow-no-subscriptions
          az account set --subscription "${AZURE_SUBSCRIPTION_ID}"

      - name: Deploy platform.bicep
        run: |
          DEPLOYMENT_OUTPUTS="$(az deployment group create \
            -g "${AZURE_RESOURCE_GROUP}" \
            -f infra/platform.bicep \
            -p "${PLATFORM_PARAMETER_FILE}" \
            -p deploymentCommitSha="${{ needs.resolve.outputs.commitSha }}" \
            -p webImageDigest="${WEB_IMAGE_DIGEST}" \
            -p apiImageDigest="${API_IMAGE_DIGEST}" \
            -p jobsImageDigest="${JOBS_IMAGE_DIGEST}" \
            --mode Incremental \
            --rollback-on-error \
            --query 'properties.outputs.{frontDoorHost:frontDoorEndpointHostName.value,webAppName:webContainerAppName.value,apiAppName:apiContainerAppName.value,jobsAppName:jobsContainerAppName.value}' \
            -o json)"
          FRONT_DOOR_HOST="$(jq -er '.frontDoorHost' <<< "${DEPLOYMENT_OUTPUTS}")"
          WEB_APP_NAME="$(jq -er '.webAppName' <<< "${DEPLOYMENT_OUTPUTS}")"
          API_APP_NAME="$(jq -er '.apiAppName' <<< "${DEPLOYMENT_OUTPUTS}")"
          JOBS_APP_NAME="$(jq -er '.jobsAppName' <<< "${DEPLOYMENT_OUTPUTS}")"
          if [ -z "${FRONT_DOOR_HOST}" ] || [ -z "${WEB_APP_NAME}" ] || [ -z "${API_APP_NAME}" ] || [ -z "${JOBS_APP_NAME}" ]; then
            echo "ERROR: deployment did not return the required endpoint and Container App names"
            exit 1
          fi
          echo "FRONT_DOOR_HOST=${FRONT_DOOR_HOST}" >> "$GITHUB_ENV"
          echo "WEB_APP_NAME=${WEB_APP_NAME}" >> "$GITHUB_ENV"
          echo "API_APP_NAME=${API_APP_NAME}" >> "$GITHUB_ENV"
          echo "JOBS_APP_NAME=${JOBS_APP_NAME}" >> "$GITHUB_ENV"

      - name: Verify active revision image digests
        run: |
          verify_active_revision_image() {
            local app_name="$1"
            local container_name="$2"
            local expected_image="$3"
            local active_revisions
            local running_image

            mapfile -t active_revisions < <(
              az containerapp revision list \
                -g "${AZURE_RESOURCE_GROUP}" \
                -n "${app_name}" \
                --query '[?properties.active].name' \
                -o tsv
            )
            if [ "${#active_revisions[@]}" -ne 1 ]; then
              echo "ERROR: ${app_name} must have exactly one active revision"
              exit 1
            fi
            running_image="$(az containerapp revision show \
              -g "${AZURE_RESOURCE_GROUP}" \
              -n "${app_name}" \
              --revision "${active_revisions[0]}" \
              --query "properties.template.containers[?name == '${container_name}'].image | [0]" \
              -o tsv)"
            if [ "${running_image}" != "${expected_image}" ]; then
              echo "ERROR: ${app_name} active revision does not use the verified image digest"
              exit 1
            fi
          }

          verify_active_revision_image \
            "${WEB_APP_NAME}" \
            "agent-sentinel-web" \
            "${ACR_LOGIN_SERVER}/agent-sentinel-web@${WEB_IMAGE_DIGEST}"
          verify_active_revision_image \
            "${API_APP_NAME}" \
            "agent-sentinel-api" \
            "${ACR_LOGIN_SERVER}/agent-sentinel-api@${API_IMAGE_DIGEST}"
          verify_active_revision_image \
            "${JOBS_APP_NAME}" \
            "agent-sentinel-jobs" \
            "${ACR_LOGIN_SERVER}/agent-sentinel-jobs@${JOBS_IMAGE_DIGEST}"

      - name: Smoke test - Front Door SPA and API
        run: |
          for path in / /health /api/connector/status; do
            STATUS=$(curl -sS -o /dev/null -w '%{http_code}' "https://${FRONT_DOOR_HOST}${path}")
            echo "Front Door GET ${path}: ${STATUS}"
            [ "$STATUS" = "200" ] || exit 1
          done

      - name: Smoke test - anonymous mutation stays blocked
        run: |
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST "https://${FRONT_DOOR_HOST}/api/demo/reset")
          echo "Anonymous POST /api/demo/reset: ${STATUS}"
          case "${STATUS}" in
            401|403) ;;
            *) echo "Expected 401 or 403, got ${STATUS}"; exit 1 ;;
          esac
